name: Build desktop clients

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            target: windows-x64
          - os: macos-15-intel
            architecture: x64
            target: macos-x64
          - os: macos-15
            architecture: arm64
            target: macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: python -m pip install ".[gui]" "pyinstaller>=6.14,<7"

      - name: Smoke test editor and conversion
        # This file has no dependency on the rest of the local test suite.
        run: python tests/test_smoke.py

      - name: Build application bundle
        run: python -m PyInstaller --clean --noconfirm MDFrameEditor.spec

      - name: Package Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "dist/MD Frame Editor" -DestinationPath "MDFrameEditor-${{ matrix.target }}.zip"

      - name: Package macOS client
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/MDFrameEditor.app" "MDFrameEditor-${{ matrix.target }}.zip"
          zip -j "MDFrameEditor-${{ matrix.target }}.zip" LICENSE README.md

      - name: Upload client
        uses: actions/upload-artifact@v6
        with:
          name: MDFrameEditor-${{ matrix.target }}
          path: MDFrameEditor-${{ matrix.target }}.zip
          if-no-files-found: error
          compression-level: 0
