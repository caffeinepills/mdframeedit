name: Build desktop clients

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            target: windows-x64
            executable: dist/MD Frame Editor/MDFrameEditor.exe
          - os: macos-15-intel
            architecture: x64
            target: macos-x64
            executable: dist/MDFrameEditor.app/Contents/MacOS/MDFrameEditor
          - os: macos-15
            architecture: arm64
            target: macos-arm64
            executable: dist/MDFrameEditor.app/Contents/MacOS/MDFrameEditor
          - os: ubuntu-22.04
            architecture: x64
            target: linux-x64
            executable: dist/MD Frame Editor/MDFrameEditor

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxkbcommon-x11-0 xauth xvfb

      - name: Install build dependencies
        run: python -m pip install ".[gui]" "pyinstaller>=6.14,<7"

      - name: Test action aliases
        run: python tests/runner/test_action_alias.py

      - name: Test native JSON format
        run: python tests/runner/test_native_format.py

      - name: Test image atlas import
        run: python tests/runner/test_image_atlas.py

      - name: Test format adapters
        run: python tests/runner/test_format_adapters.py

      - name: Test runtime containers
        run: python tests/runner/test_runtime_format.py

      - name: Test project builds
        run: python tests/runner/test_project_build.py

      - name: Smoke test editor and CLI
        if: runner.os != 'Linux'
        # This file has no dependency on the rest of the local test suite.
        run: python tests/runner/test_smoke.py

      - name: Smoke test Linux editor and CLI
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/runner/test_smoke.py

      - name: Build application bundle
        run: python -m PyInstaller --clean --noconfirm MDFrameEditor.spec

      - name: Smoke test packaged CLI
        env:
          MDFRAMEEDIT_TEST_EXECUTABLE: ${{ matrix.executable }}
        run: python tests/runner/test_smoke.py EditorSmokeTest.test_cli_converts_both_formats

      - name: Package Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "dist/MD Frame Editor" -DestinationPath "MDFrameEditor-${{ matrix.target }}.zip"

      - name: Package macOS client
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/MDFrameEditor.app" "MDFrameEditor-${{ matrix.target }}.zip"
          zip -j "MDFrameEditor-${{ matrix.target }}.zip" LICENSE README.md

      - name: Package Linux client
        if: runner.os == 'Linux'
        run: tar -czf "MDFrameEditor-${{ matrix.target }}.tar.gz" -C dist "MD Frame Editor"

      - name: Upload client
        uses: actions/upload-artifact@v6
        with:
          name: MDFrameEditor-${{ matrix.target }}
          path: MDFrameEditor-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0
