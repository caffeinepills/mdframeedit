format: mdfe-project
version: 1

# Optional conventions. Each sprite chooses a rig; coordinates stay in the sprite.
rigs:
  monster:
    name: Monster
    action_points: [head, center, left_hand, right_hand]
    suggested_actions: [Idle, Walk]
    action_fallbacks:
      Shoot: [Charge]
      Strike: [Attack]
      Chop: [Strike, Attack]
      Scratch: [Slice, Strike, Multistrike, Attack]
      Punch: [Slap, Strike, Multistrike, Attack]
      Slap: [Strike, Multistrike, Attack]
      Slice: [Scratch, Strike, Multistrike, Attack]
      MultiScratch: [Multistrike, Scratch, Strike, Attack]
      MultiStrike: [Strike, Attack]
      Uppercut: [Punch, Slap, Multistrike, Attack]
      Ricochet: [Attack]
      Bite: [Attack]
      Shake: [FlapAround, Hover, Charge]
      Jab: [Attack]
      Kick: [Attack]
      Lick: [Attack]
      Slam: [Attack]
      Stomp: [Attack]
      Appeal: [Dance, Shake, Twirl, Rotate]
      Dance: [FlapAround, Hover, Rotate]
      Twirl: [Rotate]
      TailWhip: [Rotate]
      Sing: [Sound, Shoot, Charge]
      Sound: [Shoot, Charge]
      Rumble: [Charge]
      FlapAround: [Hover, Charge]
      Gas: [Shoot, Charge]
      Shock: [Emit, Charge]
      Emit: [Shake, Shoot, Charge]
      SpAttack: [Shoot, Charge]
      Withdraw: [Charge]
      RearUp: [Charge]
      Swell: [Charge]

packing:
  padding: 1
  power_of_two: false

palette:
  enabled: true
  include_transparent: false

animations:
  fallbacks:
    Run: [Walk, Idle]
  custom:
    Stop:
      source: Walk
      frames: [0]
      duration: 8
  rush:
    enabled: false
    divisor: 3
    actions: []
