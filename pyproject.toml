[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdframeedit"
dynamic = ["version"]
description = "Frame editor for FrameData.xml and AnimData.xml sprite sheets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyglet~=2.0.7",
    "PySide6~=6.9.1",
    "pillow~=11.3.0",
]

[tool.setuptools]
py-modules = ["main", "data", "formats", "utils"]
packages = ["gui"]

[tool.setuptools.dynamic]
version = {attr = "data.VERSION"}
