[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "MD Frame Editor"
dynamic = ["version"]
description = "Frame editor for FrameData.xml and AnimData.xml sprite sheets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow~=13.0.0",
]

[project.optional-dependencies]
gui = ["pyglet~=2.0.7", "PySide6~=6.9.1"]

[tool.setuptools]
py-modules = ["main", "data", "formats", "utils", "cli", "conversion", "action_alias"]
packages = ["gui"]

[tool.setuptools.dynamic]
version = {attr = "data.VERSION"}

[project.scripts]
mdframeedit-convert = "cli:main"

[tool.ruff.lint]
select = ["ALL"]
future-annotations = true

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
testpaths = ["tests/local"]
norecursedirs = ["cli", "runner"]
